<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flexbox Center Example</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh; /* Đảm bảo phủ trọn màn hình và không bị tràn nếu nội dung dài */
      background-color: #f4f6f8;
    }

    .box {
      padding: 24px 32px;
      background-color: #e0f2fe; /* Màu xanh dương nhạt dịu mắt */
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 119, 182, 0.15), 0 2px 6px rgba(0, 0, 0, 0.06); /* Đổ bóng nhẹ nhàng */
      text-align: center;
      text-transform: uppercase; /* Toàn bộ chữ chuyển thành in hoa */
      letter-spacing: 0.5px;     /* Giãn cách chữ giúp chữ in hoa thoáng và dễ đọc hơn */
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">
      <h1>Chính giữa trang!</h1>
      <p>Nội dung này được căn giữa theo cả chiều dọc và ngang.</p>
    </div>
  </div>
</body>
</html>
