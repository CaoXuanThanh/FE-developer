<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox & Grid Demo</title>
    <link rel="stylesheet" href="buoi3.css">
</head>
<body>

    <!-- Yêu cầu 1: Flexbox căn giữa -->
    <div class="flex-wrapper">
        <div class="container">
            <h2>Hộp nội dung được căn giữa</h2>
            <p>Sử dụng Flexbox</p>
        </div>
    </div>

    <!-- Yêu cầu 2: CSS Grid 3 cột -->
    <div class="grid-layout">
        <div class="grid-item">Cột 1</div>
        <div class="grid-item">Cột 2</div>
        <div class="grid-item">Cột 3</div>
    </div>

</body>
</html>
