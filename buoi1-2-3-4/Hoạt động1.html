<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Căn giữa với Flexbox</title>
    <link rel="stylesheet" href="hoatdong1-style.css">
</head>
<body>

    <!-- Container chiếm toàn bộ màn hình (100vh) và không có viền -->
    <div class="container">
        <!-- Khung viền đỏ ở trong có chứa icon -->
        <div class="box">
            <div class="icon">
                <!-- Icon SVG dấu tích thành công -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <h1>Căn giữa thành công!</h1>
            <p>Phần tử này được căn chính giữa trang web theo cả chiều dọc và chiều ngang nhờ CSS Flexbox.</p>
        </div>
    </div>

</body>
</html>
