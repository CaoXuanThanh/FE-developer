<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 3 — CSS Typing | TiNi</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #16324f; background: #f3f8fc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 40px 20px; }
    main { width: min(100%, 760px); }
    .eyebrow { color: #087c81; font-size: .8rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1.15; letter-spacing: -.04em; margin: 20px 0; }
    .intro { color: #4e6378; line-height: 1.8; max-width: 540px; }
    .terminal { margin: 32px 0 24px; overflow: hidden; background: white; border: 1px solid #dce8f0; border-radius: 20px; box-shadow: 0 18px 45px #16324f0c; }
    .terminal-bar { display: flex; align-items: center; gap: 7px; padding: 17px 20px; border-bottom: 1px solid #e4edf4; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #a7c4dc; }
    .dot:nth-child(2) { background: #78b7ba; }
    .dot:nth-child(3) { background: #91b9ef; }
    .terminal-title { margin-left: 7px; font-size: .78rem; color: #4e6378; }
    .typing-area { padding: 40px clamp(16px, 4vw, 32px); min-height: 150px; display: flex; align-items: center; }
    /* Câu có đúng 22 ký tự, gồm dấu cách và dấu câu. */
    .typing-line { box-sizing: content-box; margin: 0; width: 22ch; white-space: nowrap; overflow: hidden; border-right: 2px solid #087c81; color: #1261cf; font: 600 clamp(.9rem, 3.8vw, 1.8rem)/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; animation: typing 3s steps(22, end) forwards, caret 700ms step-end infinite; }
    .note { color: #4e6378; font-size: .88rem; line-height: 1.7; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    @keyframes typing { from { width: 0; } to { width: 22ch; } }
    @keyframes caret { 0%, 100% { border-color: #087c81; } 50% { border-color: transparent; } }
    @media (prefers-reduced-motion: reduce) { .typing-line { animation: none; width: 22ch; border-color: transparent; } }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="eyebrow">TiNi · CSS Animation · Bài 03</span>
      <h1>Bắt đầu bằng<br>một lời chào.</h1>
      <p class="intro">Từng ký tự xuất hiện theo nhịp gõ. Một cách nhỏ để lời giới thiệu trở nên sinh động hơn.</p>
    </header>
    <section class="terminal" aria-label="Lời giới thiệu">
      <div class="terminal-bar" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="terminal-title">hello.css</span></div>
      <div class="typing-area">
        <p class="sr-only">Xin chào, tôi là TiNi.</p>
        <p class="typing-line" aria-hidden="true">Xin chào, tôi là TiNi.</p>
      </div>
    </section>
    <p class="note">Tải lại trang để xem hiệu ứng gõ chữ từ đầu.</p>
  </main>
</body>
</html>
