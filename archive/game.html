<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Game Rắn Săn Mồi Test Git</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #1e1e1e;
      color: #fff;
      font-family: sans-serif;
    }
    canvas {
      background-color: #000;
      border: 2px solid #4CAF50;
      box-shadow: 0 0 15px #4CAF50;
    }
    #ui {
      margin-left: 30px;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas" width="400" height="400"></canvas>
  
  <div id="ui">
    <h2>Điểm: <span id="score">0</span></h2>
    <p>Dùng 4 phím mũi tên để di chuyển</p>
    <p style="color: #aaa; font-size: 14px;">(dân vọc)</p>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const gridSize = 20;
    
    let snake = [{x: 160, y: 160}, {x: 140, y: 160}, {x: 120, y: 160}];
    let dx = gridSize;
    let dy = 0;
    let foodX, foodY;
    let score = 0;
    let gameLoop;

    function randomFood() {
      foodX = Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize;
      foodY = Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize;
    }

    function drawGame() {
      // Xóa khung hình cũ
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Tính vị trí đầu rắn mới
      const head = {x: snake[0].x + dx, y: snake[0].y + dy};
      snake.unshift(head);

      // Kiểm tra ăn mồi
      if (head.x === foodX && head.y === foodY) {
        score += 10;
        document.getElementById("score").innerText = score;
        randomFood();
      } else {
        snake.pop(); // Xóa đuôi nếu không ăn mồi
      }

      // Kiểm tra va chạm tường hoặc cắn vào đuôi
      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height || 
          snake.slice(1).some(segment => segment.x === head.x && segment.y === head.y)) {
        clearInterval(gameLoop);
        alert("Thua rồi! Điểm của bạn: " + score + "\nBấm F5 (hoặc tải lại trang) để chơi lại.");
        return;
      }

      // Vẽ cục mồi
      ctx.fillStyle = "red";
      ctx.fillRect(foodX, foodY, gridSize - 2, gridSize - 2);

      // Vẽ con rắn
      ctx.fillStyle = "lime";
      snake.forEach(part => {
        ctx.fillRect(part.x, part.y, gridSize - 2, gridSize - 2);
      });
    }

    // Bắt sự kiện bàn phím
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp" && dy === 0) { dx = 0; dy = -gridSize; }
      else if (e.key === "ArrowDown" && dy === 0) { dx = 0; dy = gridSize; }
      else if (e.key === "ArrowLeft" && dx === 0) { dx = -gridSize; dy = 0; }
      else if (e.key === "ArrowRight" && dx === 0) { dx = gridSize; dy = 0; }
    });

    randomFood();
    // Tốc độ game (100ms)
    gameLoop = setInterval(drawGame, 100);
  </script>
</body>
</html>
