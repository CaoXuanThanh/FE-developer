<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bố cục CSS Grid 3 Cột</title>
  <!-- Liên kết file Grid.css -->
  <link rel="stylesheet" href="Grid.css" />
</head>
<body>
  <div class="grid-container">
    <div class="grid-item">
      <div class="icon">🚀</div>
      <h3>Khám Phá</h3>
      <p>Nội dung thẻ thứ nhất với màu nền xám nhạt và bo góc 10px.</p>
    </div>

    <div class="grid-item">
      <div class="icon">💡</div>
      <h3>Sáng Tạo</h3>
      <p>Nội dung thẻ thứ hai với màu nền xám nhạt và bo góc 10px.</p>
    </div>

    <div class="grid-item">
      <div class="icon">⚡</div>
      <h3>Tốc Độ</h3>
      <p>Nội dung thẻ thứ ba với màu nền xám nhạt và bo góc 10px.</p>
    </div>
  </div>
</body>
</html>
